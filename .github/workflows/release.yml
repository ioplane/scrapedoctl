name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GORELEASER_VERSION: "v2.18.0"

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: true

      - name: Verify module downloads
        run: go mod verify

      - name: Verify clean module graph
        run: go mod tidy -diff

      - name: Install verified release tools
        run: go run ./cmd/devtool release-tools

      - name: Generate completions
        run: |
          mkdir -p completions
          go run ./cmd/scrapedoctl completion bash > completions/scrapedoctl.bash
          go run ./cmd/scrapedoctl completion zsh > completions/scrapedoctl.zsh
          go run ./cmd/scrapedoctl completion fish > completions/scrapedoctl.fish
          go run ./cmd/scrapedoctl completion powershell > completions/scrapedoctl.psm1
          VERSION="${GITHUB_REF_NAME#v}"
          pwsh -Command "New-ModuleManifest -Path ./completions/scrapedoctl.psd1 -RootModule './scrapedoctl.psm1' -Author 'Pavel Lavrukhin' -CompanyName 'ioplane' -Description 'PowerShell completion for scrapedoctl' -ModuleVersion '${VERSION}' -FunctionsToExport @() -CmdletsToExport @() -VariablesToExport @() -AliasesToExport @()"
          ls -la completions/

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release manifest and SBOMs
        run: go run ./cmd/devtool release-manifest dist/checksums.txt

      - name: Publish validated release
        run: gh release edit "${RELEASE_TAG}" --draft=false --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
